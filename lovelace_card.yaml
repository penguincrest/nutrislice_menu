# ─── Nutrislice School Menu – Lovelace card ──────────────────────────────────
# The card ships with the integration (v1.1.0+) and loads automatically on
# every dashboard — no HACS frontend plugin or dashboard resource needed.
# It also appears in the card picker as "Nutrislice Menu".
#
# Before 9:30 AM  → defaults to TODAY's menu
# 9:30 AM onwards → defaults to TOMORROW's menu
# ‹ › in the header step through every day the sensors have loaded.
#
# Find your real entity IDs under:
#   Settings → Devices & Services → Nutrislice School Menu → your device

type: custom:nutrislice-menu-card
breakfast_entity: sensor.chenoweth_menu_breakfast_today
lunch_entity: sensor.chenoweth_menu_lunch_today
# title: School Menu   # optional
